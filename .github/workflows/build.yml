
name: Gerar APK TV Flutuante VR

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar projeto Android
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP do projeto não encontrado"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          ROOT=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)
          if [ -z "$ROOT" ]; then
            echo "Projeto Android não encontrado no ZIP"
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Baixar modelo de reconhecimento das mãos
        run: |
          mkdir -p "$PROJECT_ROOT/app/src/main/assets"
          curl -L --fail -o "$PROJECT_ROOT/app/src/main/assets/hand_landmarker.task" \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task

      - name: Compilar APK
        run: gradle -p "$PROJECT_ROOT" assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TV-Flutuante-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          
